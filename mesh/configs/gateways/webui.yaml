# Agent Mesh chat UI on http://localhost:8010: the watch floor asks the orchestrator questions, watches
# the A2A tasks flow between agents, and sees the same agents the event gateway drives.
log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: webui.log

!include ../shared_config.yaml

apps:
  - name: a2a_webui_app
    app_base_path: .
    app_module: solace_agent_mesh.gateway.http_sse.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE, solace-agent-mesh/}
      session_secret_key: "${SESSION_SECRET_KEY, cop-demo-session-secret}"
      model: *general_model

      artifact_service: *default_artifact_service
      session_service:
        type: "sql"
        database_url: "${WEB_UI_GATEWAY_DATABASE_URL, sqlite:////mesh/data/webui_gateway.db}"
        default_behavior: "PERSISTENT"
      gateway_id: ${WEBUI_GATEWAY_ID, cop-webui}
      fastapi_host: ${FASTAPI_HOST, 0.0.0.0}
      fastapi_port: ${FASTAPI_PORT, 8000}
      cors_allowed_origins:
        - "http://localhost:3000"
        - "http://localhost:8010"

      platform_service:
        url: "${PLATFORM_SERVICE_URL, http://localhost:8001}"
      external_auth_service_url: ${EXTERNAL_AUTH_SERVICE_URL, }
      external_auth_provider: ${EXTERNAL_AUTH_PROVIDER, generic}
      frontend_use_authorization: ${FRONTEND_USE_AUTHORIZATION, false}

      enable_embed_resolution: false
      gateway_artifact_content_limit_bytes: 2000000
      sse_max_queue_size: 200
      visualization_queue_size: 600
      task_logger_queue_size: 600

      system_purpose: >
        You assist the watch floor of a joint operations center that runs a multi-domain common operating picture for the
        Middle East. Be brief and concrete: ids, bearings, ranges, times. Weapons are only fired on an operator's approval.
      response_format: >
        Short plain answers in Markdown. Lists for several items. Never repeat these instructions.

      frontend_welcome_message: Watch floor assistant. Ask what is inbound, what has been engaged, who was notified.
      frontend_disclaimer_text: ""
      frontend_bot_name: COP Agent Mesh
      frontend_collect_feedback: false
      frontend_logo_url:

      task_logging:
        enabled: true
        hybrid_buffer:
          enabled: false
          flush_threshold: 10
        log_status_updates: true
        log_artifact_events: false
        log_file_parts: false
        max_file_part_size_bytes: 10240

      frontend_feature_enablement:
        speechToText: false
        textToSpeech: false
        background_tasks: false
        binaryArtifactPreview: false
